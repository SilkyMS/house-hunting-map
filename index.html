<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>House Hunting: School Towns Map</title>
<link rel="stylesheet" href="assets/leaflet/leaflet.css">
<style>
html,body{margin:0;height:100%;background:#f7f5f0;font-family:"DejaVu Sans",Verdana,sans-serif;color:#222}
#map{position:absolute;inset:0;background:#dfe9f0}
.panel{background:#fff;padding:8px 10px;border:1px solid #b9b6ae;border-radius:4px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.panel h1{font-size:15px;margin:0 0 6px}.panel select{font-size:13px;max-width:220px}
.lbl{background:none;border:none;box-shadow:none;font-weight:bold;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.lbl-water{color:#1f5f94;font-style:italic;font-size:14px}.lbl-man{color:#1f2a44;font-size:13px}
.lbl-town{color:#222;font-size:11px;font-weight:normal}
.leaflet-tooltip.lbl:before{display:none}
.pop h3{margin:0 0 4px;font-size:14px}.pop .c{color:#777;font-size:11px;margin-bottom:6px}.pop td{vertical-align:top;padding:2px 4px;font-size:12px}.pop td:first-child{font-weight:bold;white-space:nowrap}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-2px;border:1px solid #7a6a20}
.src{font-size:10px;color:#777;margin-top:4px}
</style></head><body><div id="map"></div>
<script src="assets/leaflet/leaflet.js"></script>
<script>
const C={county:"#aebcf2",acc:"#f2c418",water:"#8ec3ea",wedge:"#4f8fc4",ink:"#1f2a44"};
const map=L.map('map',{zoomSnap:0.25}).setView([40.95,-73.9],8);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,
 attribution:'Basemap: Esri, HERE, Garmin, OpenStreetMap contributors | Boundaries and water: US Census Bureau 2021'}).addTo(map);
['states','counties','water','towns','points','manhattan'].forEach(n=>map.createPane(n));
const z={states:400,counties:410,water:420,towns:430,manhattan:440,points:450};for(const k in z)map.getPane(k).style.zIndex=z[k];
const get=f=>fetch('assets/'+f+'.geojson').then(r=>r.json());
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function pop(p){return `<div class="pop"><h3>${esc(p.label)}</h3><div class="c">${esc(p.cname)}</div><table>
<tr><td>District</td><td>${esc(p.district)}</td></tr><tr><td>Niche rank</td><td>${esc(p.niche)}</td></tr>
<tr><td>Commute</td><td>${esc(p.commute)}</td></tr><tr><td>Median price</td><td>${esc(p.price)}</td></tr>
<tr><td>County median</td><td>${esc(p.cmed)}</td></tr></table></div>`}
const countyLayers={};
Promise.all(['states','counties','water','towns','points','manhattan'].map(get)).then(([st,co,wa,to,pt,mn])=>{
 L.geoJSON(st,{pane:'states',interactive:false,style:f=>({color:'#5f5b54',weight:1.3,fillColor:f.properties.fill,fillOpacity:.35})}).addTo(map);
 const cl=L.geoJSON(co,{pane:'counties',style:{color:'#6d7bb5',weight:1.2,fillColor:C.county,fillOpacity:.45},
  onEachFeature:(f,l)=>{countyLayers[f.properties.key]=l;l.bindTooltip(f.properties.name,{sticky:true})}}).addTo(map);
 L.geoJSON(wa,{pane:'water',interactive:false,style:{color:C.wedge,weight:.6,fillColor:C.water,fillOpacity:1}}).addTo(map);
 L.geoJSON(to,{pane:'towns',style:{color:'#8a6d00',weight:1,fillColor:C.acc,fillOpacity:.85},
  onEachFeature:(f,l)=>{l.bindPopup(pop(f.properties),{maxWidth:320});l.bindTooltip(f.properties.label,{direction:'center',className:'lbl lbl-town'})}}).addTo(map);
 L.geoJSON(pt,{pane:'points',pointToLayer:(f,ll)=>L.circleMarker(ll,{pane:'points',radius:6,color:'#7a5c00',weight:1.5,fillColor:C.acc,fillOpacity:1}),
  onEachFeature:(f,l)=>{l.bindPopup(pop(f.properties),{maxWidth:320});l.bindTooltip(f.properties.label,{direction:'right',offset:[6,0],className:'lbl lbl-town'})}}).addTo(map);
 L.geoJSON(mn,{pane:'manhattan',interactive:false,style:{color:C.ink,weight:1.5,fillColor:C.ink,fillOpacity:.25}}).addTo(map);
 L.circleMarker([40.758,-73.9855],{pane:'manhattan',radius:7,color:'#fff',weight:2,fillColor:C.ink,fillOpacity:1}).addTo(map)
  .bindTooltip('Manhattan',{permanent:true,direction:'right',offset:[8,0],className:'lbl lbl-man'});
 const wl=(ll,t)=>L.tooltip({permanent:true,direction:'center',className:'lbl lbl-water'}).setLatLng(ll).setContent(t).addTo(map);
 wl([41.32,-73.985],'Hudson River');wl([41.05,-73.33],'Long Island Sound');wl([40.45,-73.6],'Atlantic Ocean');
 map.fitBounds(cl.getBounds());window.home=cl.getBounds();
 const sel=document.getElementById('county');co.features.forEach(f=>sel.add(new Option(f.properties.name,f.properties.key)));
 sel.onchange=()=>map.flyToBounds(sel.value?countyLayers[sel.value].getBounds():window.home,{padding:[20,20],duration:.8});
 window.mapReady=true;
});
const ctl=L.control({position:'topright'});ctl.onAdd=()=>{const d=L.DomUtil.create('div','panel');
 d.innerHTML=`<h1>School towns near Manhattan</h1><label>Zoom to county: <select id="county"><option value="">All counties</option></select></label>
 <div class="legend" style="margin-top:6px"><i style="background:${C.acc}"></i>Featured school town (click for details)<br><i style="background:${C.county};border-color:#6d7bb5"></i>Featured county</div>
 <div class="src">Data: research.md, Niche 2026. Verify before deciding.</div>`;L.DomEvent.disableClickPropagation(d);return d};ctl.addTo(map);
</script></body></html>
